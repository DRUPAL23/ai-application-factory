name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Compile
        run: python -m compileall app
      - name: Tests
        run: pytest -q

  container:
    runs-on: ubuntu-latest
    needs: api
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t ai-application-factory:${{ github.sha }} .
