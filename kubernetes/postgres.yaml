apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ai-application-factory
type: Opaque
stringData:
  POSTGRES_DB: factory
  POSTGRES_USER: factory
  POSTGRES_PASSWORD: change-me-before-production
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-application-factory
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ai-application-factory
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
