apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ai-application-factory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/drupal23/ai-application-factory-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: factory-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ai-application-factory
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
